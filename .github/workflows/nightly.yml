# Location: .github/workflows/nightly.yml
name: Nightly GPU Integration

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  gpu-integration:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v1

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run full test suite including GPU tests
        run: pytest -v

      - name: Run F1 regression check
        run: python scripts/check_f1_regression.py --threshold -0.02

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-regression-report
          path: f1_report.json
