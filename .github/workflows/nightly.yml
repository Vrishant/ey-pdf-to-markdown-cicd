# Location: .github/workflows/nightly.yml
name: Nightly GPU Integration

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gpu-integration:
    runs-on: [self-hosted, gpu, kaggle]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Prefetch models
        run: python scripts/prefetch_models.py

      - name: Run full test suite (incl. GPU-marked)
        run: pytest -m gpu -v

      - name: Run F1 regression check
        run: python scripts/check_f1_regression.py --output f1_report.json

      - name: Upload F1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-regression-report
          path: f1_report.json
          if-no-files-found: warn