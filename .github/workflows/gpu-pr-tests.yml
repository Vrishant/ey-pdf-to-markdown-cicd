# Location: .github/workflows/gpu-pr-tests.yml
name: GPU Tests (develop -> main PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  gpu-tests:
    if: github.head_ref == 'develop'
    runs-on: [self-hosted, gpu, kaggle]
    environment: gpu-tests   # requires manual approval — see setup note below
    env:
      PDF2MD_MODEL_DIR: /kaggle/working/models
    steps:
      - uses: actions/checkout@v4

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Prefetch models
        run: python scripts/prefetch_models.py

      - name: Run full test suite (includes GPU tests)
        run: pytest -v

      - name: F1 regression check
        run: python scripts/check_f1_regression.py --threshold -0.02

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-regression-report-${{ github.event.pull_request.number }}
          path: f1_report.json